# Migraciones de base de datos (Alembic).
# Crear una migración tras cambiar app/models.py:
#   cd pms && alembic revision --autogenerate -m "descripcion" --rev-id 0002
# Aplicarlas: se hace solo al arrancar el PMS (app/migraciones.py), o a mano con:  alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
