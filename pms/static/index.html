<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>INVERPMS · Grupo INVERSIETE</title>
  <link rel="icon" type="image/png" href="/static/marca/favicon.png">
  <link rel="apple-touch-icon" href="/static/marca/favicon.png">
  <meta name="theme-color" content="#0e0e10">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="login" class="login hidden">
    <div class="login-wrap">
    <img class="login-logo" src="/static/marca/inversiete-oscuro.png" alt="INVERSIETE">
    <div class="wordmark">INVER<b>PMS</b></div>
    <form id="loginForm" class="login-card">
      <h1>Acceso a la plataforma de gestión</h1>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn primary" type="submit">Entrar</button>
      <p id="loginError" class="error"></p>
    </form>
    <div class="login-pie">
      <img src="/static/marca/comercial_del_campo-oscuro.png" alt="Comercial del Campo">
      <img src="/static/marca/edificios_cameranos-oscuro.png" alt="Edificios Cameranos">
    </div>
    </div>
  </div>

  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div class="brand"><img src="/static/marca/inversiete-marca-oscuro.png" alt=""><div><div class="wordmark">INVER<b>PMS</b></div><small>Grupo INVERSIETE</small></div></div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header class="topbar">
        <button id="menuBtn" class="btn ghost menu-btn" aria-label="Menú">☰</button>
        <h2 id="viewTitle"></h2>
        <div class="topbar-right">
          <select id="assetFilter" title="Filtrar por activo"></select>
          <button id="iaBtn" class="btn ia-btn hidden" title="Peticiones IA: informes, documentos y tablas Excel">✦ Peticiones IA</button>
          <div class="usuario"><span id="userAvatar" class="avatar"></span><span id="userName" class="user"></span></div>
          <button id="logoutBtn" class="btn ghost">Salir</button>
        </div>
      </header>
      <section id="view" class="view"></section>
    </main>
  </div>

  <dialog id="modal"><form method="dialog" id="modalForm"></form></dialog>
  <dialog id="iaPanel" class="ia-panel"></dialog>
  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
