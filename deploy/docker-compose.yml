# PMS Grupo INVERSIETE - despliegue en producción
#   cp .env.example .env   (y rellenar)
#   docker compose up -d --build
name: pms

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pms
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d pms"]
      interval: 5s
      timeout: 5s
      retries: 20
    # sin puertos publicados: solo accesible desde la aplicación

  app:
    build: ../pms
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PMS_DATABASE_URL: postgresql+psycopg://pms:${DB_PASSWORD}@db:5432/pms
      PMS_SECRET_KEY: ${PMS_SECRET_KEY:?Defina PMS_SECRET_KEY en .env}
      PMS_ADMIN_EMAIL: ${PMS_ADMIN_EMAIL:-admin@inversiete.es}
      PMS_ADMIN_PASSWORD: ${PMS_ADMIN_PASSWORD:?Defina PMS_ADMIN_PASSWORD en .env}
      PMS_TOKEN_HOURS: ${PMS_TOKEN_HOURS:-12}
      # copias de documentos de identidad, cifradas con PMS_DOCS_KEY
      PMS_DOCS_DIR: /data/documentos
      PMS_DOCS_KEY: ${PMS_DOCS_KEY:-}
      # avisos por correo (ver INSTALACION.md, apartado 8 ter)
      PMS_URL: https://${PMS_DOMINIO}
      PMS_SMTP_HOST: ${PMS_SMTP_HOST:-}
      PMS_SMTP_PORT: ${PMS_SMTP_PORT:-587}
      PMS_SMTP_USER: ${PMS_SMTP_USER:-}
      PMS_SMTP_PASSWORD: ${PMS_SMTP_PASSWORD:-}
      PMS_SMTP_FROM: ${PMS_SMTP_FROM:-}
      PMS_SMTP_SEGURIDAD: ${PMS_SMTP_SEGURIDAD:-starttls}
      PMS_AVISOS_HORA: ${PMS_AVISOS_HORA:-07:30}
      PMS_MANTENIMIENTO_EMAIL: ${PMS_MANTENIMIENTO_EMAIL:-alfonso@inversiete.es}
      TZ: Europe/Madrid
    volumes:
      - documentos:/data/documentos
    # Si el PMS se cuelga, su vigilante deja el diagnóstico en /data/documentos/_diagnostico y se reinicia solo.
    # «docker ps» muestra además si responde (healthy / unhealthy).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/salud', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  caddy:
    # proxy con HTTPS automático (certificado Let's Encrypt)
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PMS_DOMINIO: ${PMS_DOMINIO:?Defina PMS_DOMINIO en .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sitios:/etc/caddy/sitios:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  documentos:
  caddy_data:
  caddy_config:
